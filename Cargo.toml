[package]
name = "scratchbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
log = "0.4.35"

crossterm = { git = "https://github.com/maxdexh/crossterm-scratchbar", rev = "cd11d5c0eb24c9ed061dd2b86b6a78f603afd8d7", default-features = false, features = ["events", "event-stream", "serde"] }
anyhow = "1.0.104"
flexi_logger = "0.31.10"
serde = { version = "1.0.229", features = ["rc"] }
postcard = { version = "1.1.3", features = [
  "alloc",
  "use-std",
], default-features = false }
tempfile = "3.27.0"
unicode-width = "0.2.3"
futures = { version = "0.3.34", default-features = false, features = ["alloc"] }

tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "io-util",
  "process",
  "fs",
] }
tokio-util = { version = "0.7.20", features = ["rt", "time"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
base64 = { version = "0.23.1" }
unicode-segmentation = "1.13.3"

chrono = { version = "0.4.45", default-features = false }
hyprland = { version = "0.4.0-beta.3", features = [
    "async-lite",
    "listener",
], default-features = false }
# feature required for Option<T> decoder
zbus = { version = "6.2.0", features = ["option-as-array"] }
libpulse-binding = "2.30.1"
system-tray = "0.8.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2.191"
