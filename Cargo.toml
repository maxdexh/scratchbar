[package]
name = "scratchbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
log = "0.4.29"

crossterm = { git = "https://github.com/maxdexh/crossterm-scratchbar", default-features = false, features = ["events", "event-stream", "serde"] }
anyhow = "1.0.100"
flexi_logger = "0.31.7"
serde = { version = "1.0.228", features = ["rc"] }
postcard = { version = "1.1.3", features = [
  "alloc",
  "use-std",
], default-features = false }
tempfile = "3.24.0"
unicode-width = "0.2.2"
futures = { version = "0.3.31", default-features = false, features = ["alloc"] }

tokio = { version = "1.49.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "io-util",
  "process",
  "fs",
] }
tokio-util = { version = "0.7.18", features = ["rt", "time"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
base64 = { version = "0.22.1" }
unicode-segmentation = "1.12.0"

chrono = { version = "0.4.43", default-features = false }
hyprland = { version = "0.4.0-beta.3", features = [
    "async-lite",
    "listener",
], default-features = false }
zbus = "5.13.2"
libpulse-binding = "2.30.1"
system-tray = "0.8.5"
image = { version = "0.25.9", default-features = false, features = ["png"] }
